name: Build KoY-Auto APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x koy-auto/gradlew

      - name: Test, lint and build Debug APK
        run: |
          cd koy-auto
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: always()
        run: |
          echo '## Gradle diagnostics (last 200 lines)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 koy-auto/build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'BUILD FAILED' koy-auto/build.log; then
            DIAGNOSTIC="$(grep -E -B 2 -A 10 '(^e: |error: |What went wrong|Execution failed for task|Caused by:)' koy-auto/build.log | head -n 100)"
            DIAGNOSTIC="${DIAGNOSTIC//'%'/'%25'}"
            DIAGNOSTIC="${DIAGNOSTIC//$'\r'/'%0D'}"
            DIAGNOSTIC="${DIAGNOSTIC//$'\n'/'%0A'}"
            echo "::error title=Gradle failure::$DIAGNOSTIC"
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KoY-Auto-Debug-APK
          path: koy-auto/app/build/outputs/apk/debug/*.apk

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KoY-Auto-Gradle-Log
          path: koy-auto/build.log
