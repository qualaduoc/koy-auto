name: Build KoY-Auto APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x koy-auto/gradlew

      - name: Test, lint and build Debug APK
        run: |
          cd koy-auto
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoY-Auto-Debug-APK
          path: koy-auto/app/build/outputs/apk/debug/*.apk
