name: Build KoY-Auto APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x koy-auto/gradlew

      - name: Build Debug APK
        run: |
          cd koy-auto
          ./gradlew assembleDebug --stacktrace > ../build_output.txt 2>&1 || (cat ../build_output.txt && exit 1)

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KoY-Auto-Debug-APK
          path: koy-auto/app/build/outputs/apk/debug/*.apk
